name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        app: [pdf_fit_print, unzipper]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pypdf pyinstaller

      - name: Build ${{ matrix.app }}
        run: pyinstaller --onefile --windowed ${{ matrix.app }}.py

      - name: Upload ${{ matrix.app }}.exe
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-exe
          path: dist/${{ matrix.app }}.exe
