name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pypdf pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --windowed pdf_fit_print.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: pdf_fit_print-exe
          path: dist/pdf_fit_print.exe
